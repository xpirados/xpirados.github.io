<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><!-- sem-copia: prévia da página "só para membros" para o dono avaliar -->
<title>XPirados, só para membros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Allerta+Stencil&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Para onde vai quem clica numa ferramenta (todas são fechadas, amarra 144): diz que ela é de quem está no servidor do XPirados
   (amarra 123), põe o alistamento como o botão principal e abre a ferramenta para quem já é membro. A ferramenta vem na
   consulta (?ferramenta=montador); sem ela, a página fala das ferramentas fechadas em geral. */
:root{
  --noite:#0f1113; --concreto:#17191b; --linha:#33373b;
  --poeira:#efe9dd; --poeira2:#bdb6a8; --sinal:#ff8a3d; --sinal2:#ffb27a;
  --gigante:"Black Ops One","Allerta Stencil",Impact,sans-serif;
  --display:"Allerta Stencil","Arial Narrow",Impact,sans-serif;
  --texto:"Atkinson Hyperlegible","Segoe UI",Verdana,sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  color-scheme:dark;
}
html{background:var(--noite)}
body{background:var(--noite);color:var(--poeira);font-family:var(--texto);font-size:19px;line-height:1.55;overflow-x:hidden;
  background-image:repeating-radial-gradient(circle at 70% 20%,transparent 0 22px,rgba(255,138,61,.05) 22px 23px)}
.casca{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 80px;display:grid;gap:20px}
.topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--display);letter-spacing:.14em;color:var(--poeira);text-decoration:none}
.marca img{width:34px;height:34px}
.linguas{margin-left:auto;display:flex;gap:6px}
.linguas button{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;background:transparent;color:var(--poeira2);border:1px solid var(--linha);padding:8px 10px;min-width:44px;min-height:40px;cursor:pointer}
.linguas button[aria-pressed="true"]{color:var(--noite);background:var(--sinal);border-color:var(--sinal)}
.cadeado{font-family:var(--mono);font-size:.8rem;letter-spacing:.16em;color:var(--sinal2);display:flex;gap:10px;align-items:center}
.cadeado::before{content:"";width:14px;height:12px;border:2px solid currentColor;border-radius:2px;box-shadow:0 -7px 0 -3px var(--noite),0 -9px 0 -2px currentColor}
h1{font-family:var(--gigante);font-weight:400;font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;margin:0}
p{margin:0;max-width:62ch}
.acoes{display:grid;gap:12px}
.acoes a{display:block;text-align:center;font-family:var(--display);letter-spacing:.08em;text-decoration:none;padding:16px;min-height:56px;box-sizing:border-box;border:1px solid var(--sinal)}
.ima{background:var(--sinal);color:var(--noite)}
.sec{color:var(--poeira)}
.nota{font-size:.9rem;color:var(--poeira2)}
</style>

<div class="casca">
  <div class="topo">
    <a class="marca" href="index.html"><img src="img/xpirados.png" alt="">XPIRADOS</a>
    <div class="linguas" role="group" aria-label="Idioma">
      <button type="button" data-l="pt" aria-pressed="true">PT</button><button type="button" data-l="es" aria-pressed="false">ES</button><button type="button" data-l="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <p class="cadeado" data-t="selo">ACESSO RESTRITO</p>
  <h1 id="titulo"></h1>
  <p id="texto"></p>

  <div class="acoes">
    <a class="ima" href="alistamento.html" data-t="alistar"></a>
    <a class="sec" id="abrir" href="#" target="_blank" rel="noopener"></a>
  </div>
  <p class="nota" data-t="nota"></p>
</div>

<script>
(function(){
  var FERRAMENTAS = {
    montador: {url: "https://montador.xpirados.com.br", nome: {pt: "o Montador de armas", es: "el Montador de armas", en: "the Weapon Builder"}},
    dicionario: {url: "https://montador.xpirados.com.br/dicionario", nome: {pt: "o Dicionário de campo", es: "el Diccionario de campo", en: "the Field Dictionary"}},
    mapas: {url: "https://mapas.xpirados.com.br", nome: {pt: "os Mapas em 3D", es: "los Mapas en 3D", en: "the 3D Maps"}},
    guias: {url: "https://xpirados.github.io/ovni-area51/", nome: {pt: "os Guias do clã", es: "las Guías del clan", en: "the Clan Guides"}},
    /* sem endereço ainda: o membro volta ao site */
    atlas: {url: "", nome: {pt: "o Atlas de Artefatos", es: "el Atlas de Artefactos", en: "the Artifact Atlas"}},
    gadgets: {url: "", nome: {pt: "o Comparar gadgets", es: "el Comparador de gadgets", en: "the Gadget Comparison"}}
  };
  var T = {
    pt: {selo: "ACESSO RESTRITO", titulo: "Só para quem está no servidor do XPirados",
         texto: function(n){ return (n ? "Você clicou n" + n.slice(1) + ". " : "") + "As ferramentas do site são para quem está no servidor do XPirados no Discord, inclusive os clãs parceiros que moram lá. Na entrada, a ferramenta pede o seu Discord e confere só se você está no servidor."; },
         abrir: "Já sou membro: abrir a ferramenta", abrirGeral: "Voltar ao site", alistar: "Ainda não sou: solicitar alistamento",
         nota: "Consultamos só se você participa do servidor. Não guardamos nome, e-mail nem senha do Discord."},
    es: {selo: "ACCESO RESTRINGIDO", titulo: "Solo para quien está en el servidor de XPirados",
         texto: function(n){ return (n ? "Hiciste clic en " + n + ". " : "") + "Las herramientas del sitio son para quien está en el servidor de XPirados en Discord, incluidos los clanes aliados que viven allí. Al entrar, la herramienta pide tu Discord y solo verifica si estás en el servidor."; },
         abrir: "Ya soy miembro: abrir la herramienta", abrirGeral: "Volver al sitio", alistar: "Todavía no: solicitar alistamiento",
         nota: "Solo consultamos si participas del servidor. No guardamos tu nombre, correo ni contraseña de Discord."},
    en: {selo: "RESTRICTED ACCESS", titulo: "Only for members of the XPirados server",
         texto: function(n){ return (n ? "You clicked " + n + ". " : "") + "The site's tools are for members of the XPirados Discord server, including the partner clans that live there. On entry, the tool asks for your Discord and only checks whether you are in the server."; },
         abrir: "I'm a member: open the tool", abrirGeral: "Back to the site", alistar: "Not yet: request enlistment",
         nota: "We only check whether you belong to the server. We don't keep your Discord name, email or password."}
  };
  var qual = (/[?&]ferramenta=([a-z0-9-]+)/.exec(location.search) || [])[1], f = FERRAMENTAS[qual];
  var abrir = document.getElementById("abrir");
  function pinta(l){
    var t = T[l]; document.documentElement.lang = l === "pt" ? "pt-BR" : l;
    document.getElementById("titulo").textContent = t.titulo;
    document.getElementById("texto").textContent = t.texto(f ? f.nome[l] : "");
    [].forEach.call(document.querySelectorAll("[data-t]"), function(e){ e.textContent = t[e.getAttribute("data-t")]; });
    if (f && f.url){ abrir.href = f.url; abrir.textContent = t.abrir; } else { abrir.href = "index.html"; abrir.removeAttribute("target"); abrir.textContent = t.abrirGeral; }
    [].forEach.call(document.querySelectorAll(".linguas button"), function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-l") === l); });
    try { localStorage.setItem("xp-lingua", l); } catch (e) {}
  }
  [].forEach.call(document.querySelectorAll(".linguas button"), function(b){ b.addEventListener("click", function(){ pinta(b.getAttribute("data-l")); }); });
  var guardada = null; try { guardada = localStorage.getItem("xp-lingua"); } catch (e) {}
  var nav = (navigator.language || "pt").slice(0, 2);
  pinta(T[guardada] ? guardada : T[nav] ? nav : "pt");
})();
</script>
</body></html>
